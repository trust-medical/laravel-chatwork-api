name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the top-most CHANGELOG section as the release notes. The
      # maintainer renames `## [Unreleased]` to `## [x.y.z] - DATE`
      # before tagging (see the note at the top of CHANGELOG.md); if
      # that is forgotten the notes will literally say "Unreleased",
      # which is a visible, harmless reminder rather than a silent miss.
      - name: Extract changelog section
        id: changelog
        run: |
          notes=$(awk '/^## \[/{n++; if (n==2) exit} n==1{print}' CHANGELOG.md)
          {
            echo 'notes<<__CHANGELOG_EOF__'
            echo "$notes"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --verify-tag
