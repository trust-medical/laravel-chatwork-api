name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extract the CHANGELOG section that matches the pushed tag (e.g.
      # `v1.0.0` -> `## [1.0.0]` or `## [1.0.0] - DATE`). Matching by
      # version rather than "top-most section" keeps the standard Keep-a-
      # Changelog flow intact, where a fresh empty `## [Unreleased]` is
      # left at the top after each release. If the section is missing
      # (forgot to rename `[Unreleased]`, or wrong tag), fail loudly so
      # the GitHub Release is not created with empty/wrong notes.
      - name: Extract changelog section
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          notes=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]( |$)" { capture=1; print; next }
            /^## \[/ && capture { exit }
            /^\[[^]]+\]:/ && capture { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::No CHANGELOG section found for version ${version} (tag ${TAG_NAME}). Did you forget to rename '## [Unreleased]' to '## [${version}] - DATE'?"
            exit 1
          fi
          {
            echo 'notes<<__CHANGELOG_EOF__'
            echo "$notes"
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            --verify-tag
