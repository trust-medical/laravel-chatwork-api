name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer run lint:test

  analyse:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer run analyse

  tests:
    name: Pest (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['^11.0', '^12.0']
        dependency-version: [prefer-stable, prefer-lowest]
        # Laravel 13 は前方互換カナリア。pestphp/pest-plugin-laravel が
        # laravel/framework ^11|^12 までしか許可しないため composer 解決
        # 段階で必ず失敗する。対応版が出るまで experimental（非ブロッキング）。
        include:
          - php: '8.3'
            laravel: '^13.0'
            dependency-version: prefer-stable
            experimental: true
          - php: '8.4'
            laravel: '^13.0'
            dependency-version: prefer-stable
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: pcov
      - name: Pin Laravel versions
        run: |
          composer require \
            "illuminate/cache:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/notifications:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            --no-update --no-interaction
      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist
      - run: composer run test:coverage
